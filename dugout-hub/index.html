<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#93cff2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">

<title>Dugout Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* One world, on purpose: a baby-blue pinstripe jersey up top, a white scorebook page below.
   Layout idea: his name in jersey script is the only loud thing; everything under it is ruled lines, not boxes. */
:root{
  --sky:#93cff2; --sky-deep:#3d9bd6; --navy:#0d2b55; --paper:#ffffff; --grey:#eceff3; --rule:#cdd5df; --mid:#55667f;
  --stitch:#d2342a; --ok:#187a47; --amber:#8f5600; --amber-bg:#fff2d2;
  --script:"Yellowtail","Brush Script MT",cursive;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
html{touch-action:manipulation}
body{background:var(--paper);color:var(--navy);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--cond);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:46px;font-weight:800} h2{font-size:30px} h3{font-size:22px;font-weight:600}
p{margin:0} a{color:var(--navy)}
.mid{color:var(--mid)} .small{font-size:16px} .num{font-variant-numeric:tabular-nums}
.in{max-width:1040px;margin:0 auto;padding-left:18px;padding-right:18px}

/* top bar */
.top{background:var(--navy);color:#fff}
body.player .top{background:var(--sky);color:var(--navy)}
.top .in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;padding-bottom:8px}
.brand{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.01em}
.mode{display:flex;gap:18px}
.mode a{font-family:var(--cond);font-weight:600;font-size:20px;text-decoration:none;color:inherit;opacity:.65;padding:6px 0;border-bottom:3px solid transparent}
.mode a[aria-current="true"]{opacity:1;border-bottom-color:currentColor}

/* jersey band */
.jersey{background-color:var(--sky);
  background-image:linear-gradient(to top,var(--navy) 0 6px,#fff 6px 11px,var(--navy) 11px 13px,transparent 13px),repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 2px,transparent 2px 28px)}
.jersey .in{display:grid;grid-template-columns:1fr;gap:18px;padding-top:8px;padding-bottom:36px;align-items:end}
.name{font-family:var(--script);font-size:clamp(76px,17vw,132px);line-height:.86;color:var(--navy);text-shadow:3px 3px 0 #fff,-1px -1px 0 #fff;transform:rotate(-4deg);transform-origin:left bottom;display:inline-block;padding:14px 10px 0 2px}
.tail{display:block;width:min(78%,430px);height:auto;margin:-2px 0 0 22px;transform:rotate(-4deg);transform-origin:left top}
.rank{font-family:var(--cond);font-weight:700;font-size:30px;margin-top:14px}
.line{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:17px;margin-top:4px}
.line b{font-family:var(--cond);font-weight:800;font-size:22px}
.bases{display:flex;align-items:center;gap:14px}
.bases svg{width:132px;height:132px;flex:none}
.bases .xp{font-family:var(--cond);font-weight:800;font-size:34px;line-height:1}
.strip{background-color:var(--sky);background-image:linear-gradient(to top,var(--navy) 0 6px,#fff 6px 11px,var(--navy) 11px 13px,transparent 13px),repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 2px,transparent 2px 28px)}
.strip .in{padding-top:10px;padding-bottom:30px;display:flex;flex-direction:column;gap:8px}
body.coach .strip{background:var(--navy);color:#fff}
body.coach .strip .in{padding-bottom:18px}
body.coach .strip .mid{color:#c5d3e8}

main{padding-top:20px;padding-bottom:calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:26px}
.two{display:grid;grid-template-columns:1fr;gap:26px 40px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:800px){
  .jersey .in{grid-template-columns:1fr auto}
  .two{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}
  .two.even{grid-template-columns:1fr 1fr}
  .two .full{grid-column:1 / -1}
}
.sec{border-top:4px solid var(--navy);padding-top:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec.plain{border-top:0;padding-top:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.say{font-size:21px;line-height:1.3}

/* session tabs and lineup */
.stabs{display:flex;gap:6px;border-bottom:2px solid var(--rule)}
.stabs button{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-start;background:none;border:0;border-bottom:5px solid transparent;margin-bottom:-2px;padding:8px 4px 10px;font-family:var(--cond);font-weight:700;font-size:26px;color:var(--mid);cursor:pointer;text-align:left}
.stabs button small{display:block;font-family:var(--body);font-weight:400;font-size:15px;line-height:1.3}
.stabs button small+small{color:var(--mid);font-size:14px}
.stabs button[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.inning{display:flex;justify-content:space-between;background:var(--grey);padding:6px 10px;font-family:var(--cond);font-weight:600;font-size:19px;color:var(--mid)}
.li{display:grid;grid-template-columns:46px 1fr 50px;gap:6px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--navy);background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 4px;cursor:pointer}
.li .n{font-family:var(--cond);font-weight:800;font-size:36px;line-height:1;color:var(--sky-deep);font-variant-numeric:tabular-nums}
.li .t{display:block;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1}
.li .d{display:block;font-size:17px;color:var(--mid)}
.li .mark{justify-self:center;width:26px;height:26px;border:3px solid var(--navy);transform:rotate(45deg)}
.li[aria-pressed="true"] .mark{background:var(--navy)}
.li[aria-pressed="true"] .n,.li[aria-pressed="true"] .t{color:var(--mid)}
.count{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 4px 12px 56px;border-bottom:1px solid var(--rule);font-size:17px}
.count input{width:88px;font-family:var(--cond);font-weight:700;font-size:26px;text-align:center}

label.fld{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--mid);flex:none;min-width:0}
.row > label.fld{flex:1 1 120px}
input,select{font:inherit;font-size:17px;color:var(--navy);background:#fff;border:2px solid var(--rule);border-radius:6px;padding:10px;min-width:0;width:100%}
input[type="range"]{padding:0;border:0;accent-color:var(--navy)}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--navy);flex:none}
.btn{font-family:var(--cond);font-weight:700;font-size:23px;border-radius:6px;border:2px solid var(--navy);background:var(--navy);color:#fff;padding:11px 20px;cursor:pointer}
.btn.big{font-size:30px;padding:16px;width:100%}
.btn.line{background:#fff;color:var(--navy)}
.btn.sm{font-size:18px;padding:5px 12px}
.btn.del{border-color:var(--stitch);background:#fff;color:var(--stitch)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sky-deep);outline-offset:2px}
.status{font-family:var(--cond);font-weight:700;font-size:20px}
.status.ok{color:var(--ok)}
.weekdone{background:var(--navy);color:#fff;padding:16px 18px;border-radius:6px;display:flex;flex-direction:column;gap:2px}
.weekdone b{font-family:var(--cond);font-size:30px;line-height:1.1}
.weekdone span{font-size:17px;color:#cfe6f7} .status.wait{color:var(--amber)} .status.stop{color:var(--stitch)}
.note{background:var(--amber-bg);border-left:6px solid var(--amber);padding:10px 12px;font-size:17px}

/* film room */
.stage{background:#081a33;display:grid;place-items:center;min-height:200px}
.stage video{display:block;max-width:100%;max-height:62vh}
.strip8{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.fr{display:flex;flex-direction:column;gap:4px;min-width:0}
.fr img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--grey);border:3px solid transparent}
.fr.hit img{border-color:var(--stitch)}
.fr b{font-family:var(--cond);font-weight:700;font-size:19px}
.fr span{font-size:14px;color:var(--mid);line-height:1.25}

.cmp{display:grid;grid-auto-flow:column;grid-template-rows:auto auto auto;grid-auto-columns:minmax(118px,1fr);gap:6px 8px;overflow-x:auto;padding-bottom:6px}
.cmp img,.cmp .blank{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--grey);display:block}
.cmp b{font-family:var(--cond);font-weight:700;font-size:18px;text-align:center}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hist{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--rule);padding:10px 0;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:var(--navy);text-align:left;cursor:pointer}

/* trophies */
.patches{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:20px 12px}
.patch{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;color:var(--mid)}
.patch .ring{width:86px;height:86px;border-radius:50%;border:3px dashed var(--rule);display:grid;place-items:center;color:var(--rule)}
.patch .ring svg{width:40px;height:40px}
.patch b{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.05}
.patch span{font-size:14px;line-height:1.25}
.patch.on{color:var(--navy)}
.patch.on .ring{border:3px solid #fff;background:var(--navy);color:#fff;box-shadow:0 0 0 4px var(--navy)}

table{border-collapse:collapse;width:100%;font-size:17px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:14px;color:var(--mid);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.v{font-family:var(--cond);font-weight:700;font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.math{font-size:14px;color:var(--mid);font-variant-numeric:tabular-nums}
td input{width:84px}
.bigv{font-family:var(--cond);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:15px;color:var(--mid)}
.spark{width:100%;height:auto;display:block}
.bar{height:14px;background:var(--grey)} .bar i{display:block;height:100%;background:var(--navy)}
.entry{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--rule);padding:8px 0;font-size:17px}
ol{margin:0;padding-left:22px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:#fff;border-top:4px solid var(--navy);display:flex;justify-content:center;z-index:5}
nav.tabs a{flex:1 1 0;max-width:230px;text-decoration:none;color:var(--mid);font-family:var(--cond);font-weight:700;font-size:23px;text-align:center;padding:13px 4px 17px}
nav.tabs a[aria-current="page"]{color:#fff;background:var(--navy)}
nav.tabs .lockbtn{flex:0 0 auto;background:#fff;border:0;border-left:2px solid var(--rule);font-family:var(--cond);font-weight:700;font-size:21px;color:var(--stitch);padding:13px 18px 17px;cursor:pointer}
#toast{position:fixed;left:16px;right:16px;bottom:92px;margin:0 auto;max-width:520px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:6px;font-size:17px;z-index:7;display:none}
#toast.on{display:block}
.cheer{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:24px;text-align:center;background-color:var(--sky);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.6) 0 2px,transparent 2px 28px)}
.cheer .box{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:520px}
.cheer .gain{font-family:var(--cond);font-weight:800;font-size:112px;line-height:.9;color:var(--navy);text-shadow:4px 4px 0 #fff}
@media (prefers-reduced-motion:no-preference){
  .cheer .gain{animation:land .45s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes land{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body class="player">
<header class="top"><div class="in">
  <div class="brand">Dugout Hub</div>
  <div class="mode" role="group" aria-label="Who is using the hub">
    <a href="#today" data-m="player">Player</a>
    <a href="#log" data-m="coach">Coach</a>
  </div>
</div></header>
<div id="view"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="toast" role="status"></div>
<div id="cheer"></div>

<script>
/*LOGIC-START*/
const HubLogic = (() => {
  const DAY = 86400000;
  const parse = s => { const p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); };
  const iso = dt => dt.toISOString().slice(0, 10);
  const addDays = (s, n) => iso(new Date(parse(s).getTime() + n * DAY));
  const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / DAY);
  const mondayOf = s => addDays(s, -((parse(s).getUTCDay() + 6) % 7));
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const isNum = v => typeof v === 'number' && isFinite(v);
  const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0);

  const pctVsGame = (oz, game) => (isNum(oz) && isNum(game) && game > 0) ? (oz - game) / game * 100 : null;
  const fitStatus = p => p == null ? 'unknown' : Math.abs(p) <= 3 ? 'match' : p < -20 ? 'verylight' : p <= 20 ? 'inrange' : p <= 50 ? 'heavy' : 'veryheavy';

  // MLB Pitch Smart, ages 7-14: rest days by pitches thrown in a day.
  const restDays = p => p <= 20 ? 0 : p <= 35 ? 1 : p <= 50 ? 2 : p <= 65 ? 3 : 4;
  // Accepts scorebook style (2.1 = 2 innings + 1 out) and decimals (2.33).
  const outsFromInnings = x => { if (!isNum(x) || x < 0) return 0; const f = x - Math.floor(x); return Math.floor(x) * 3 + ((f > 0.05 && f < 0.15) || (f >= 0.28 && f < 0.5) ? 1 : (f >= 0.15 && f < 0.28) || f >= 0.5 ? 2 : 0); };
  const fmtInnings = outs => Math.floor(outs / 3) + (outs % 3 ? ' ' + (outs % 3) + '/3' : '');

  function armStatus(entries, today, dailyMax) {
    const days = {};
    for (const e of entries) {
      if (e.kind !== 'pitch' || !e.date || e.date > today) continue;
      const d = days[e.date] || (days[e.date] = { pitches: 0, outs: 0 });
      d.pitches += e.pitches || 0; d.outs += e.outs || 0;
    }
    const dates = Object.keys(days).sort();
    let clearedOn = null, driver = null, outs12 = 0, over = null;
    const yearAgo = addDays(today, -365);
    for (const dt of dates) {
      const d = days[dt], c = addDays(dt, restDays(d.pitches) + 1);
      if (!clearedOn || c > clearedOn) { clearedOn = c; driver = { date: dt, pitches: d.pitches, rest: restDays(d.pitches) }; }
      if (dt > yearAgo) outs12 += d.outs;
      if (d.pitches > dailyMax && dt > addDays(today, -7)) over = { date: dt, pitches: d.pitches };
    }
    let threeDay = false;
    if (days[addDays(today, -1)] && days[addDays(today, -2)]) {
      threeDay = true;
      const t = addDays(today, 1);
      if (!clearedOn || t > clearedOn) clearedOn = t;
    }
    const outs3 = [0, 1, 2].reduce((s, n) => s + ((days[addDays(today, -n)] || {}).outs || 0), 0);
    const last = dates.length ? Object.assign({ date: dates[dates.length - 1] }, days[dates[dates.length - 1]]) : null;
    return { last, driver, clearedOn, cleared: !clearedOn || today >= clearedOn, threeDay, outs12, outs3, over };
  }

  function stats(entries, today) {
    const rStart = addDays(today, -28), pStart = addDays(today, -56);
    const inRecent = e => e.date > rStart && e.date <= today;
    const inPrior = e => e.date > pStart && e.date <= rStart;
    const sw = entries.filter(e => e.kind === 'swing');
    const bat = f => avg(sw.filter(f).map(e => e.batSpeed).filter(isNum));
    const batRecent = bat(inRecent), batPrior = bat(inPrior);
    const real = sw.filter(e => e.ball !== 'mini');
    const exitRecent = avg(real.filter(inRecent).map(e => e.exitVelo).filter(isNum));
    const ratio = e => (isNum(e.batSpeed) && isNum(e.exitVelo) && e.batSpeed > 0) ? e.exitVelo / e.batSpeed : null;
    const ratiosAll = real.map(ratio).filter(isNum);
    const squareRecent = avg(real.filter(inRecent).map(ratio).filter(isNum));
    const squareBest = ratiosAll.length ? Math.max.apply(null, ratiosAll) : null;
    const mach = entries.filter(e => e.kind === 'machine' && inRecent(e));
    const made = mach.reduce((s, e) => s + (e.made || 0), 0), of = mach.reduce((s, e) => s + (e.of || 0), 0);
    const games = entries.filter(e => e.kind === 'game' && inRecent(e));
    const sum = k => games.reduce((s, e) => s + (e[k] || 0), 0);
    const ab = sum('ab'), hits = sum('h'), k = sum('k'), bb = sum('bb'), pa = ab + bb;
    return {
      swingN: sw.filter(inRecent).length, batRecent, batPrior,
      batTrend: (batRecent != null && batPrior != null) ? batRecent - batPrior : null,
      exitRecent, squareRecent, squareBest,
      contactMade: made, contactOf: of, contactRate: of > 0 ? made / of : null,
      ab, hits, k, bb, pa, kRate: pa > 0 ? k / pa : null, battingAvg: ab > 0 ? hits / ab : null
    };
  }

  const pc = x => Math.round(x * 100) + '%';
  // Starting rules written for this hub, not published standards.
  const RULES = { contactGood: 0.70, contactLow: 0.60, kHigh: 0.30, minPA: 8, squareDrop: 0.90, speedFlat: 1 };

  function decideFocus(s, entries, today, rules) {
    const R = rules || RULES;
    if (s.swingN < 1 && s.contactOf < 10) return { focus: 'baseline', why: 'No bat speed or machine count in the last 4 weeks. This week measures where he stands.' };
    const prev = today ? [1, 2].map(k => weekInfo(entries, addDays(mondayOf(today), -7 * k)).lockedFocus) : [];
    const tired = f => prev.length === 2 && prev[0] === f && prev[1] === f;   // already ran the last two weeks
    const gameBad = s.pa >= R.minPA && s.kRate >= R.kHigh;
    if (s.contactRate != null && s.contactRate >= R.contactGood && gameBad && !tired('timing'))
      return { focus: 'timing', why: 'Machine contact is ' + pc(s.contactRate) + ' but he struck out in ' + pc(s.kRate) + ' of ' + s.pa + ' game trips. Practice is not carrying over.' };
    if (s.contactRate != null && s.contactRate < R.contactLow && !tired('contact'))
      return { focus: 'contact', why: 'Machine contact is ' + pc(s.contactRate) + ' (' + s.contactMade + ' of ' + s.contactOf + '). The target is ' + pc(R.contactGood) + '.' };
    if (gameBad && s.contactRate == null && !tired('contact'))
      return { focus: 'contact', why: 'He struck out in ' + pc(s.kRate) + ' of ' + s.pa + ' game trips and there is no machine count yet.' };
    if (s.squareRecent != null && s.squareBest != null && s.squareRecent < R.squareDrop * s.squareBest && !tired('contact'))
      return { focus: 'contact', why: 'Squared-up score is ' + s.squareRecent.toFixed(2) + ' against his best of ' + s.squareBest.toFixed(2) + '. The swing is fine but he is missing the middle of the bat.' };
    if (s.batTrend != null && s.batTrend < R.speedFlat && !tired('speed'))
      return { focus: 'speed', why: 'Bat speed moved ' + (s.batTrend >= 0 ? '+' : '') + s.batTrend.toFixed(1) + ' mph against the 4 weeks before. Contact is holding, so speed is next.' };
    const hintable = ['path', 'speed', 'contact', 'timing'];
    const hint = today ? entries.filter(e => e.kind === 'analysis' && hintable.indexOf(e.fixArea) >= 0 && e.date > addDays(today, -14) && e.date <= today).sort(byDate).pop() : null;
    if (hint && !tired(hint.fixArea)) return { focus: hint.fixArea, why: 'The numbers flag nothing, so the plan follows the latest filmstrip note: ' + String((hint.fix && hint.fix.title) || FOCUS[hint.fixArea].name).slice(0, 60) + '.' };
    const order = ['path', 'speed', 'contact'], lastUsed = {};
    for (const e of entries) if (e.kind === 'session' && order.indexOf(e.focus) >= 0 && (!lastUsed[e.focus] || e.date > lastUsed[e.focus])) lastUsed[e.focus] = e.date;

        ].map(r => h('tr', null, h('td', null, r[0]), h('td', { class: 'mid' }, r[1]))))))));
}

/* ---------- shell ---------- */
const VIEWS = { today: viewToday, film: viewFilm, trophies: viewTrophies, log: viewLog, arm: viewArm, progress: viewProgress, gear: viewGear };
const TABS = { player: [['today', 'Today'], ['film', 'Film room'], ['trophies', 'Trophies']], coach: [['log', 'Log'], ['arm', 'Arm'], ['progress', 'Progress'], ['gear', 'Gear']] };
const modeOf = r => TABS.player.some(t => t[0] === r) ? 'player' : 'coach';
function route() { const r = (location.hash || '').replace('#', ''); state.route = VIEWS[r] ? r : 'today'; if (state.route !== 'gear') state.gearDraft = null; }
function render() {
  const keep = document.activeElement && document.activeElement.id, mode = state.needKey ? 'player' : modeOf(state.route);
  document.body.className = mode;
  const body = state.needKey ? viewSetup() : mode === 'coach' && locked() ? page(strip('Coach side', 'Enter the parent code to open it.'), unlockBox(null)) : VIEWS[state.route]();
  $view.replaceChildren(...body.flat(Infinity).filter(Boolean));
  $tabs.hidden = !!state.needKey; document.querySelector('.mode').hidden = !!state.needKey;
  $tabs.replaceChildren(...[...TABS[mode].map(t => h('a', { href: '#' + t[0], 'aria-current': state.route === t[0] ? 'page' : null }, t[1])),
    mode === 'coach' && state.settings.pinHash && !locked() ? h('button', { type: 'button', class: 'lockbtn', onclick: () => { relock(); location.hash = '#today'; } }, 'Lock') : null].filter(Boolean));
  document.querySelectorAll('.mode a').forEach(a => a.setAttribute('aria-current', String(a.dataset.m === mode)));
  renderCheer();
  if (keep && !state.cheer) { const el = document.getElementById(keep); if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} } }
}
window.addEventListener('hashchange', () => { route(); state.confirmDel = null; state.pinMsg = ''; if (modeOf(state.route) === 'player') relock(); render(); window.scrollTo(0, 0); });
try { const s = JSON.parse(localStorage.getItem('dugout-ticks') || 'null'); if (s && s.t) { state.ticks = s.t; state.counts = s.c || {}; } } catch (e) {}
boot();
})();
