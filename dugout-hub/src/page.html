/* ---------- Road to the Show ---------- */
.g-stage.dynstage{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}

.dyn{max-width:1100px;margin:0 auto;padding:6px 2px 48px;font-family:Barlow,system-ui,sans-serif;color:#f4f2ec}

.dynsub{color:#c9cfdb;margin:6px 0 0;font-size:16px}

.dynfield{display:flex;flex-direction:column;gap:6px}.dynlab{font-family:var(--cond);font-weight:800;letter-spacing:.1em;color:#f28c38;font-size:14px;text-transform:uppercase}

.dynouts{display:flex;align-items:center;gap:8px}.dynouts i{width:20px;height:20px;border-radius:50%;border:3px solid #fff}.dynouts i.on{background:#e2442f;border-color:#e2442f}

.dynpc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:10px 0 4px;font-weight:700}.dynpc span{font-family:var(--cond);letter-spacing:.06em;font-size:15px;opacity:.85}.dynpc i{display:block;height:12px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden}.dynpc em{display:block;height:100%;border-radius:7px;background:#39d353;transition:width .4s}.dynpc.tired em{background:#f28c38}.dynpc b{font-family:var(--cond);font-size:22px}
.dynup2.def{border-color:#39d353;background:linear-gradient(160deg,#0f3a1f,#0e1730 75%);animation:dynglowg 1.2s ease-in-out infinite alternate}@keyframes dynglowg{to{box-shadow:0 0 28px rgba(57,211,83,.5)}}

@media (prefers-reduced-motion:reduce){.dynup2{animation:none}}
.dynsit{font-weight:800;color:#ffd23f;font-size:18px;margin:8px 0 0}

<style>
/* One world, on purpose: a baby-blue pinstripe jersey up top, a white scorebook page below.
